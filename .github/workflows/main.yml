name: zip-and-release
on: push
    
permissions:
  packages: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v7

      - name: zip
        run: |
          zip -r ijzm-qol.zip . -x ".git/*" -x ".github/*"

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.run_number }}
        run: |
          gh release create "$TAG" ijzm-qol.zip \
            --target "$GITHUB_SHA" \
            --title "${{ github.run_number }}" \
            --notes "Built by workflow run ${{ github.run_id }}" \
  
