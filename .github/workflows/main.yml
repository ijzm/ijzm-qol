name: zip-and-release
on: workflow_dispatch

permissions:
  packages: write
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-slim
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v7
      - name: zip
        run: |
          zip -r ijzm-qol.zip . -x ".git/*"
      - name: Create Release
        id: create_release
        uses: elgohr/Github-Release-Action@v5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Changes in this Release
            - First Change
            - Second Change
          draft: false
          prerelease: false
  
