name: zip-and-release
on:
  push:
    tags:
    - '*'
    
permissions:
  packages: write
  contents: write

jobs:
  zip-and-release:
    runs-on: ubuntu-slim
    steps:
      - name: Clone GIT repo
        uses: actions/checkout@v7
      - name: zip
        run: |
          zip -r ijzm-qol.zip . -x ".git/*" -x ".github/*"
      - name: Create Release
        uses: ncipollo/release-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          artifacts: "ijzm-qol.zip"

  
